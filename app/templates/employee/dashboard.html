{% block scripts %}
<script>
    const socket = io();
    let currentConvId = null;
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    socket.on('connect', () => socket.emit('join_conversations'));

    socket.on('new_reply', (data) => {
        if (data.conversation_id === currentConvId) {
            appendMessage(data.sender, data.content, data.timestamp || new Date().toISOString());
            fetch('/employee/conversation/' + currentConvId + '/mark-read', {
                method: 'POST', headers: { 'X-CSRFToken': csrfToken }
            });
        } else {
            updateUnreadBadge(data.conversation_id, 1);
        }
    });

    // REST Fallback Polling every 15 seconds
    setInterval(() => {
        fetch('/employee/conversations').then(r => r.json()).then(data => {
            data.forEach(c => {
                if (c.id !== currentConvId && c.unread_count > 0) {
                    updateUnreadBadge(c.id, c.unread_count, true);
                }
            });
        });
    }, 15000);

    function updateUnreadBadge(convId, count, absolute=false) {
        const li = document.querySelector('.conv-item[data-conv="' + convId + '"]');
        if (li) {
            let pill = li.querySelector('.unread-pill');
            if (!pill) {
                pill = document.createElement('span');
                pill.className = 'badge bg-danger rounded-pill unread-pill';
                pill.textContent = '0';
                li.querySelector('.d-flex').appendChild(pill);
            }
            pill.textContent = absolute ? count : parseInt(pill.textContent) + count;
        }
        const total = document.getElementById('totalUnread');
        total.textContent = (parseInt(total.textContent) || 0) + 1 + ' unread';
    }

    function loadChat(convId) {
        currentConvId = convId;
        // ... (keep existing load chat logic)
    }

    function appendMessage(sender, content, time) {
        const win = document.getElementById('chatWindow');
        const div = document.createElement('div');
        div.className = 'message-bubble ' + sender;
        
        // SECURITY FIX: Use textContent to prevent XSS
        const textNode = document.createElement('div');
        textNode.textContent = content; 
        div.appendChild(textNode);
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'message-time';
        timeSpan.textContent = new Date(time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        div.appendChild(timeSpan);
        
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }
    // ... (keep existing send logic)
</script>
{% endblock %}
