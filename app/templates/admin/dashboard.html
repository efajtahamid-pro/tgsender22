{% extends 'base.html' %}
{% block content %}
<h2><i class="bi bi-speedometer2 me-2"></i> Admin Dashboard</h2>
<hr>
<div class="row">
    <div class="col-md-3 mb-3"><div class="card text-white bg-primary status-card"><div class="card-body"><h5>Campaigns</h5><h2>{{ campaigns|length }}</h2><a href="{{ url_for('admin.campaigns') }}" class="text-white">Manage →</a></div></div></div>
    <div class="col-md-3 mb-3"><div class="card text-white bg-success status-card"><div class="card-body"><h5>Accounts</h5><h2>{{ accounts|length }}</h2><a href="{{ url_for('admin.accounts') }}" class="text-white">Manage →</a></div></div></div>
    <div class="col-md-3 mb-3"><div class="card text-white bg-info status-card"><div class="card-body"><h5>Proxies</h5><h2>{{ proxies|length }}</h2><a href="{{ url_for('admin.proxies') }}" class="text-white">Manage →</a></div></div></div>
    <div class="col-md-3 mb-3"><div class="card text-white bg-warning status-card"><div class="card-body"><h5>Employees</h5><h2>{{ employees|length }}</h2><a href="{{ url_for('admin.employees') }}" class="text-white">Manage →</a></div></div></div>
</div>
{% endblock %}
