{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><i class="bi bi-shield-check"></i> Verify {{ account.phone }}</div>
            <div class="card-body">
                <p class="text-muted">Enter the code sent to your Telegram app.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3"><label>Telegram Code</label><input type="text" name="code" class="form-control form-control-lg text-center" pattern="[0-9]{5}" maxlength="5" required autofocus></div>
                    <div class="mb-3"><label>2FA Password (if enabled)</label><input type="password" name="password" class="form-control"></div>
                    <button class="btn btn-success w-100">Verify</button>
                </form>
                <a href="{{ url_for('admin.accounts') }}" class="btn btn-link mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
