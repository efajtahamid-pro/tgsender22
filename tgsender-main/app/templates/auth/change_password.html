{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header"><i class="bi bi-key"></i> Change Password</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3"><label>Current Password</label><input type="password" name="old_password" class="form-control" required></div>
                    <div class="mb-3"><label>New Password</label><input type="password" name="new_password" class="form-control" required></div>
                    <small class="text-muted">Min 10 chars, upper+lower+digit+special.</small>
                    <button class="btn btn-primary w-100 mt-2">Update</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
